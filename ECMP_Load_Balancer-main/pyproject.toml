[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmp-phase2"
version = "1.0.0"
description = "Educational ECMP leaf-spine load distribution and failure recovery simulator"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ecmp-phase2 = "ecmp_phase2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
